input: .
output: .retype

url: docs.materiaal.cc

start:
  pro: true

branding:
  label: Docs
  logo: /static/media/materiaal-logo.svg

edit:
  repo: github.com/materiaalpost/docs

links:
  - text: Website
    icon: globe
    link: https://materiaal.cc
  - text: Instagram
    icon: materiaal-instagram
    link: https://instagram.com/materiaalpost

nav:
  mode: stack   # Pro key required
  icons:
    mode: pages # Pro key required

theme:
  base:
    base-link-weight: 500
    nav-item-text-active-weight: 700
    image-rounded: 0.75rem
    header-links-dropdown-offset: -1rem
    base-color: "#F26B26"

actions:
  items:
    - text: Copy page
      action: copy-page-markdown
      icon: copy
    - text: Copy link
      action: copy-page-link
      icon: link
    - type: separator
    - text: View as Markdown
      action: view-page-markdown
      icon: markdown
    - text: Print page
      action: print-page
      icon: brand-printer
    # - type: separator
    # - type: separator
    # - text: Edit on GitHub
    #   icon: mark-github
    #   action: edit-on-github
    #   target: blank

breadcrumb:
  home: ":icon-home:" # icon

generator:
  paths: root
  
toc:
  label: On this page
  depth: 2-4

footer:
  copyright: "&copy; Copyright {{ year }}. Materiaal, Inc. All rights reserved."